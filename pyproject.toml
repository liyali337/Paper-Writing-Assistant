[project]
name = "dl-agent"
version = "0.1.0"
description = "论文理解：上传 PDF，按标题分解并生成中文介绍与带图方法详解"
readme = "docs/论文理解-技术方案.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.12",
  "pymupdf>=1.24",
]

[project.optional-dependencies]
parse = [
  "docling>=2.50",
  "pymupdf>=1.24",
]
dev = [
  "pytest>=8.3",
  "httpx>=0.27",
]

[project.scripts]
dl-agent-api = "dl_agent.api.main:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
